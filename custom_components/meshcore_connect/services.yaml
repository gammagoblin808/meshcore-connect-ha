execute_action:
  name: Execute action and reply
  description: Run local actions for an authorized word request, then send the result to the original sender.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: meshcore_connect
    request_id:
      required: true
      selector:
        text:
    automation_entity:
      required: true
      selector:
        entity:
          domain: automation
get_contacts:
  name: Read contacts
  description: Read contacts or favorites directly from the connected companion.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: meshcore_connect
    favorites_only:
      default: false
      selector:
        boolean:
send_message:
  name: Send message
  description: Queue a private message for a contact. Queued does not mean delivered.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: meshcore_connect
    public_key:
      required: true
      selector:
        text:
    text:
      required: true
      selector:
        text:
          multiline: true
